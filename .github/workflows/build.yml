name: Build (reusable)

# Gjenbrukbar workflow som kompilerer, tester, bygger image med Dockerfile og genererer SBOM.

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Ref å sjekke ut (tom = default GITHUB_REF)"
        required: false
        type: string
        default: ""
      checkout-repository:
        description: "Repo å sjekke ut (tom = current repo)"
        required: false
        type: string
        default: ""
      checkout-fetch-depth:
        description: "fetch-depth for checkout"
        required: false
        type: number
        default: 1
      cache-read-only:
        description: "Gradle cache read-only"
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub Actions environment for build-jobben (tom = ingen)"
        required: false
        type: string
        default: ""
    secrets:
      READER_TOKEN:
        description: "Token for lesetilgang til GitHub Packages (navikt/sikkerhetstjenesten-felles)"
        required: false
    outputs:
      image:
        description: "Fullt image-ref med tag"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build.outputs.digest }}

# Deny-by-default på workflow-nivå; jobs åpner kun det de trenger.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    permissions:
      checks: write    # publisere test-resultater til Checks API
      contents: read   # checkout kode
      id-token: write  # nais/docker-build-push (OIDC mot GAR)
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      digest: ${{ steps.docker-push.outputs.digest }}
    steps:
      - name: Sjekker ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          repository: ${{ inputs.checkout-repository || github.repository }}
          fetch-depth: ${{ inputs.checkout-fetch-depth }}
          persist-credentials: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ inputs.cache-read-only }}

      - name: Install Java 27
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 27
          distribution: temurin

      - name: Test og bygg
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
        run: ./gradlew --warning-mode all test jacocoTestReport cyclonedxBom bootJar

      - name: Bygg og push Docker-image
        id: docker-push
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        with:
          team: sikkerhetstjenesten

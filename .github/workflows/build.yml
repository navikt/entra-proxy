name: Build (reusable)

# Gjenbrukbar workflow som kompilerer, tester, bygger image med Dockerfile og genererer SBOM.

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "Ref å sjekke ut (tom = default GITHUB_REF)"
        required: false
        type: string
        default: ""
      checkout-repository:
        description: "Repo å sjekke ut (tom = current repo)"
        required: false
        type: string
        default: ""
      checkout-fetch-depth:
        description: "fetch-depth for checkout"
        required: false
        type: number
        default: 1
      cache-read-only:
        description: "Gradle cache read-only"
        required: false
        type: boolean
        default: true
      environment:
        description: "GitHub Actions environment for build-jobben (tom = ingen)"
        required: false
        type: string
        default: ""
    secrets:
      READER_TOKEN:
        description: "Token for lesetilgang til GitHub Packages (navikt/sikkerhetstjenesten-felles)"
        required: false
    outputs:
      image:
        description: "Fullt image-ref med tag"
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: "Image digest (sha256:...)"
        value: ${{ jobs.build.outputs.digest }}

# Deny-by-default på workflow-nivå; jobs åpner kun det de trenger.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    permissions:
      checks: write    # publisere test-resultater til Checks API
      contents: read   # checkout kode
      id-token: write  # nais/docker-build-push (OIDC mot GAR)
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      digest: ${{ steps.docker-push.outputs.digest }}
    steps:
      - name: Sjekker ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          repository: ${{ inputs.checkout-repository || github.repository }}
          fetch-depth: ${{ inputs.checkout-fetch-depth }}
          persist-credentials: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c 
        with:
          cache-read-only: ${{ inputs.cache-read-only }}

      - name: Install Java 27
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: 27
          distribution: temurin

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Configure apt network timeouts
        run: |
          sudo tee /etc/apt/apt.conf.d/99-playwright-network > /dev/null <<'EOF'
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          Acquire::Retries "1";
          APT::Update::Error-Mode "any";
          EOF

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npm run playwright:install -- --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test og bygg
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
        run: ./gradlew --warning-mode all detekt test frontendTest jacocoTestReport cyclonedxBom bootJar -PdetektUtenBaseline

      - name: Vis detekt-rapport i jobbsammendrag
        if: ${{ !cancelled() }}
        run: cat build/reports/detekt/detekt.md >> "$GITHUB_STEP_SUMMARY"

      - name: Last opp detekt-rapport (HTML)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/reports/detekt/detekt.html
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Bygg og push Docker-image
        id: docker-push
        uses: nais/docker-build-push@588f76a6f45aeb1e75d5e8417ec6ef6d79b2b39f
        with:
          team: sikkerhetstjenesten

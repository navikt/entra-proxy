name: GitHub Pages with themed coverage (reusable)

on:
  workflow_call:
    inputs:
      jekyll:
        required: false
        type: boolean
        default: false
      detekt:
        required: false
        type: boolean
        default: false
      test-reports:
        required: false
        type: boolean
        default: false
      reportgenerator:
        required: false
        type: boolean
        default: false
      url-path:
        required: false
        type: string
        default: ""
    outputs:
      page_url:
        value: ${{ jobs.pages.outputs.page_url }}

permissions:
  contents: read

jobs:
  pages:
    name: Publiser GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}${{ inputs.url-path }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Sjekker ut kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Bygg eksisterende Jekyll-nettsted
        if: ${{ inputs.jekyll }}
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_site

      - name: Gi runner eierskap til nettstedet
        if: ${{ inputs.jekyll }}
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - name: Opprett nettstedsmappe
        run: mkdir -p _site

      - name: Last ned detekt-rapport
        if: ${{ inputs.detekt }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: detekt.html
          path: _site/detekt

      - name: Gjør detekt-rapporten til startside
        if: ${{ inputs.detekt }}
        run: mv _site/detekt/detekt.html _site/detekt/index.html

      - name: Last ned JaCoCo- og testrapport
        if: ${{ inputs.test-reports }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-reports
          path: reports

      - name: Kopier JaCoCo- og testrapport
        if: ${{ inputs.test-reports }}
        env:
          REPORTGENERATOR: ${{ inputs.reportgenerator }}
        run: |
          original_report=_site/jacoco
          if [ "$REPORTGENERATOR" = "true" ]; then
            original_report=_site/jacoco-original
          fi
          mkdir -p "$original_report" _site/tests
          cp -r reports/jacoco/test/html/. "$original_report/"
          cp -r reports/tests/test/. _site/tests/

      - name: Setup .NET
        if: ${{ inputs.test-reports && inputs.reportgenerator }}
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Generer dekningsrapport med ReportGenerator
        if: ${{ inputs.test-reports && inputs.reportgenerator }}
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool \
            --version 5.6.0 --tool-path "$RUNNER_TEMP/reportgenerator"
          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            "-reports:reports/jacoco/test/jacocoTestReport.xml" \
            "-targetdir:_site/jacoco" \
            "-sourcedirs:src/main/kotlin" \
            "-reporttypes:Html_Dark" \
            "-title:Entra-proxy coverage"
          test -s _site/jacoco/index.html

      - name: Last opp nettsted
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publiser nettsted
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

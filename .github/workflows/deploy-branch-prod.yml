name: Build and deploy branch to prod
on:
  workflow_dispatch:

# Én manuell prod-deploy om gangen per ref — kanseller pågående når ny kjøring startes.
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

# Deny-by-default på workflow-nivå; jobs åpner kun det de trenger.
permissions:
  contents: read

jobs:
  build:
    name: build
    permissions:
      checks: write    # publisere test-resultater til Checks API
      contents: read   # checkout kode
      id-token: write  # nais/docker-build-push (OIDC mot GAR)
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-gradle-build.yml@e57f215d69ecd0abfbff24911377061babf9571f # 0.0.112
    with:
      team: sikkerhetstjenesten
      gradle-tasks: detekt test frontendTest jacocoTestReport cyclonedxBom bootJar
      gradle-args: --warning-mode all -PdetektUtenBaseline -x npmInstall
      node: true
      playwright: true
      cache-read-only: false

  deploy:
    name: deploy
    needs: build
    permissions:
      contents: read
      id-token: write  # nais/deploy/actions/deploy (OIDC mot Nais)
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-nais-deploy.yml@3fd91ac02dac6a6a014f72e65bf79a362054801a # 0.0.113
    with:
      team: sikkerhetstjenesten
      clusters: '["prod-gcp"]'
      resource: .nais/naiserator.yaml
      image: ${{ needs.build.outputs.image }}

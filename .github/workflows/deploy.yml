name: Build and deploy
on:
  push:
    branches:
      - main

# Hindre parallelle deploys av samme branch — køes opp i stedet.
# cancel-in-progress: false fordi en pågående deploy ikke skal avbrytes midt i.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Deny-by-default på workflow-nivå; jobs åpner kun det de trenger.
permissions:
  contents: read

jobs:
  build:
    name: build
    permissions:
      checks: write    # publisere test-resultater til Checks API
      contents: read   # checkout kode
      id-token: write  # nais/docker-build-push (OIDC mot GAR)
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-gradle-build.yml@e57f215d69ecd0abfbff24911377061babf9571f # main
    with:
      team: sikkerhetstjenesten
      gradle-tasks: detekt test frontendTest jacocoTestReport cyclonedxBom bootJar
      gradle-args: --warning-mode all -PdetektUtenBaseline -x npmInstall
      node: true
      playwright: true
      cache-read-only: true

  pages:
    name: pages
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read
      pages: write     # actions/deploy-pages
      id-token: write  # actions/deploy-pages (OIDC)
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-pages.yml@e57f215d69ecd0abfbff24911377061babf9571f # main
    with:
      jekyll: true
      detekt: true
      url-path: detekt/

  deploy:
    name: deploy
    needs: build
    permissions:
      contents: read
      id-token: write  # nais/deploy/actions/deploy (OIDC mot Nais)
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-nais-deploy.yml@e57f215d69ecd0abfbff24911377061babf9571f # main
    with:
      team: sikkerhetstjenesten
      clusters: '["dev-gcp","prod-gcp"]'
      resource: .nais/naiserator.yaml,.nais/probes.yaml,.nais/probe-alerts.yaml,.nais/alerts.yaml
      image: ${{ needs.build.outputs.image }}

name: "zizmor"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write  # kreves av den gjenbrukbare workflowen
      actions: read           # zizmor leser workflow-metadata via GH API
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-zizmor.yml@a7071500cb4efccab97843c96c5477afeb8689fd # 0.0.116
    with:
      advanced-security: false

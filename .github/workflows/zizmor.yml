name: "zizmor"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write  # kreves av den gjenbrukbare workflowen
      actions: read           # zizmor leser workflow-metadata via GH API
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-zizmor.yml@5c99606faf5bebf0316c6c7884075f6a4d638666 # 0.0.114
    with:
      advanced-security: false

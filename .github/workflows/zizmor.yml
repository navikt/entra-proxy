name: "zizmor"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write  # kreves av den gjenbrukbare workflowen
      actions: read           # zizmor leser workflow-metadata via GH API
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-zizmor.yml@e1729d20f16f52eb943a4bacdb44cf3f25a2cfa2 # 0.0.117
    with:
      advanced-security: false

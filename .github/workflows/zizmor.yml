name: "zizmor"

on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    permissions:
      contents: read
      security-events: write  # kreves av den gjenbrukbare workflowen
      actions: read           # zizmor leser workflow-metadata via GH API
    uses: navikt/sikkerhetstjenesten-lib/.github/workflows/reusable-zizmor.yml@3fd91ac02dac6a6a014f72e65bf79a362054801a # 0.0.113
    with:
      advanced-security: false

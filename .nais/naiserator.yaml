apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: sikkerhetstjenesten
  annotations:
    haproxy.org/timeout-server: "120s"
  name: entra-proxy
  namespace: sikkerhetstjenesten
spec:
  strategy:
    rollingUpdate:
      maxSurge: 50%
  valkey:
    - instance: {{nais.cluster.cache}}
      access: readwrite
  leaderElection: true
  ingresses:
    {{#each ingresses as |ingress|}}
       - {{ingress}}
      {{/each}}
  image: {{image}}
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  prometheus:
    enabled: true
    path: /monitoring/prometheus
  startup:
    path: /monitoring/health/liveness
    initialDelay: 30
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    path: /monitoring/health/readiness
  liveness:
    path: /monitoring/health/liveness
  port: 8080
  terminationGracePeriodSeconds: 45
  replicas:
    max: {{replica.max}}
    min: {{replica.min}}
    scalingStrategy:
      cpu:
        thresholdPercentage: {{replica.cpuThreshold}}
  resources:
    limits:
      memory: '{{mem.max}}'
    requests:
      cpu: '{{cpu.min}}'
      memory: '{{mem.min}}'
  azure:
    application:
      enabled: true
      allowAllUsers: true
      replyURLs:
        {{#each ingresses as |ingress|}}
        - "{{ingress}}/login/oauth2/code/entra"
        {{/each}}
      claims:
        extra:
          - "NAVident"
          - "azp_name"
        groups:
          - id: "{{groups.utforsker}}"
  accessPolicy:
    outbound:
      rules:
      - application: logging
        namespace: nais-system
      - application: norg2
        namespace: org
      - application: nom-api
        namespace: nom
    inbound:
      rules:
        {{#each inbound as |app|}}
        - { application: '{{app.name}}', namespace: '{{app.namespace}}', cluster: '{{app.cluster}}' }
        {{/each}}
  env:
    - name: GROUPS_DISABLED
      value: {{groups.disabled}}
    - name: GROUPS_UTFORSKER
      value: {{groups.utforsker}}
    - name: NOMGRAPH
      value: {{nomgraph}}
    - name: NAIS_CLUSTER_TYPE
      value: {{nais.cluster.type}}
    - name: NAIS_CLUSTER_CACHE
      value: {{nais.cluster.cache}}

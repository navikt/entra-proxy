[versions]
boot-conditionals = "6.0.12"
cyclonedx = "3.6.1"
detekt = "2.0.0-alpha.6"
git-properties = "4.0.1"
jackson-annotations = "2.23"
kotest = "6.2.7"
kotlin = "2.4.21"
logbook = "4.2.0"
logstash = "9.0"
mock-oauth2-server = "7.0.0"
mockk = "1.14.12"
opentelemetry = "2.33.1"
sikkerhetstjenesten-lib = "0.0.117"
spring-boot = "4.2.0"
spring-dependency-management = "1.1.7"
springdoc = "3.2.0"
springmockk = "5.0.1"
testcontainers-redis = "3.0.1"

[libraries]
boot-conditionals = { module = "no.nav.boot:boot-conditionals", version.ref = "boot-conditionals" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
logbook-spring-boot-starter = { module = "org.zalando:logbook-spring-boot-starter", version.ref = "logbook" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
mock-oauth2-server = { module = "no.nav.security:mock-oauth2-server", version.ref = "mock-oauth2-server" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
opentelemetry-logback-mdc = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-mdc-1.0" }
sikkerhetstjenesten-lib = { module = "no.nav.felles:sikkerhetstjenesten-lib", version.ref = "sikkerhetstjenesten-lib" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-data-redis-test = { module = "org.springframework.boot:spring-boot-starter-data-redis-test" }
spring-boot-starter-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql" }
spring-boot-starter-jetty = { module = "org.springframework.boot:spring-boot-starter-jetty" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-restclient-test = { module = "org.springframework.boot:spring-boot-starter-restclient-test" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-session-data-redis = { module = "org.springframework.session:spring-session-data-redis" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainers-redis" }

[bundles]
kotest = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-extensions-spring"]
observability = ["opentelemetry-logback-mdc", "micrometer-registry-prometheus"]
spring-boot-test = ["spring-boot-starter-webmvc-test", "spring-boot-starter-restclient-test"]
testcontainers = ["testcontainers-redis", "spring-boot-testcontainers"]

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
git-properties = { id = "com.gorylenko.gradle-git-properties", version.ref = "git-properties" }
kotest = { id = "io.kotest", version.ref = "kotest" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

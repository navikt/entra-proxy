spring:
  mvc:
    log-request-details: true
management:
  endpoint:
    env:
      show-values: always
    configprops:
      show-values: always
    health:
      show-details: always
      show-components: always
  endpoints:
    web:
      exposure:
        include: '*'
  httpexchanges:
    recording:
      enabled: true

info:
  client-id: ${azure.app.client.id}

oppfolging:
  enabled: true

logbook:
  filter:
    enabled: true

management:
 endpoint:
  env:
    show-values: never
  configprops:
    show-values: never
  health:
    show-details: when_authorized
    show-components: always
 endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,beans,configprops,env,loggers

logbook:
  filter:
    enabled: true

query ansatteIEnheterUnderNomId($organisertUnderOrgEnhetId: String!) {
    organisertUnderOrgEnhet: orgEnhet(where: { id: $organisertUnderOrgEnhetId }) {
        id
        navn
    }
    orgEnheter(filter:  {
        organiseringSelection: UNDER_ANGITT_ORGENHET,
        organisertUnderOrgEnhetId:  $organisertUnderOrgEnhetId,
        periodiskUtvalg: AKTIVE,
        lovnodeSelection: LOVNODE_ENHET
    }) {
        orgEnhet {
            id
            navn
            orgTilknytninger (utvalg: AKTIVE) {
                ressurs {
                    navident
                    visningsnavn
                    gjeldendeSektor
                }
                erDagligOppfolging
            }
        }
    }
}

query bulkorgtilknytninger($navidenter: [String!]) {
    ressurser(where: {navidenter: $navidenter}) {
        ressurs {
            navident
            visningsnavn
            gjeldendeSektor
            orgTilknytninger (utvalg: AKTIVE) {
                orgEnhet {
                    id
                    navn
                    tilgangsenhetId
                }
            }
        }
    }
}
query bulkorgtilknytninger($navidenter: [String!]) {
    ressurser(where: {navidenter: $navidenter}) {
        ressurs {
            navident
            visningsnavn
            gjeldendeSektor
            orgTilknytninger (utvalg: AKTIVE) {
                erDagligOppfolging
                orgEnhet {
                    id
                    navn
                    tilgangsenhetId
                    ledere {
                        ressurs {
                            navident
                            visningsnavn
                        }
                    }
                }
            }
        }
    }
}
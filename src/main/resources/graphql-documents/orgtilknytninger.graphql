query orgtilknytninger($navident: String!) {
    ressurs(where: {navident: $navident}) {
        navident
        visningsnavn
        gjeldendeSektor
        orgTilknytninger (utvalg: AKTIVE) {
            erDagligOppfolging
            orgEnhet {
                id
                navn
                tilgangsenhetId
            }
        }
    }
}
<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ansatt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <link rel="stylesheet" href="/utforsker.css">
    <link rel="stylesheet" href="/ansatt.css">
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Ansatt</h1>
    <nav aria-label="Utforskersider">
        <a class="aksel-button" data-variant="primary" href="/grupper.html">Grupper</a>
        <a class="aksel-button" data-variant="primary" href="/gruppematrise.html">Gruppematrise</a>
        <a class="aksel-button logg-ut" data-variant="primary" data-color="danger" href="/oauth2/logout">Logg ut</a>
    </nav>
    <div class="ansatt-visning">
        <form id="ansatt-form">
            <div class="aksel-form-field">
                <label class="aksel-label" for="ansattid">Ansattid</label>
                <input class="aksel-text-field__input" id="ansattid" name="ansattid" type="text" required placeholder="Ansattid" maxlength="7" pattern="[A-Za-z][0-9]{6}">
            </div>
            <button class="aksel-button sok-knapp" data-variant="primary" data-color="brand-blue" id="sok-ansatt" type="submit">S&#248;k</button>
            <p class="aksel-body-short status" id="status" role="status" aria-live="polite"></p>
        </form>
        <section id="ansatt-resultat" aria-labelledby="ansatt-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="ansatt-overskrift">Personinformasjon (Nom)</h2>
            <table>
                <tbody id="ansatt-felter"></tbody>
            </table>
        </section>
        <section class="medlemskap-resultat" id="enheter-resultat" aria-labelledby="enheter-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="enheter-overskrift">Tilgjengelig enheter (Nom)</h2>
            <table>
                <thead><tr><th scope="col">Enhetsnummer</th><th scope="col">Enhetsnavn</th><th scope="col">Nom-Id</th><th scope="col" id="enheter-ledere-kolonne" hidden>Ledere</th></tr></thead>
                <tbody id="enheter-rader"></tbody>
            </table>
        </section>
        <section class="medlemskap-resultat" id="grupper-resultat" aria-labelledby="grupper-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="grupper-overskrift">Gruppemedlemskap</h2>
            <p id="grupper-status"></p>
            <div class="filter-rad">
                <label class="aksel-label" for="gruppe-filter">Filtrer gruppenavn</label>
                <input class="aksel-text-field__input" id="gruppe-filter" name="filter" type="text" autocomplete="off" placeholder="Inneholder...">
            </div>
            <div class="grupper-tabell" tabindex="0" role="region" aria-labelledby="grupper-overskrift">
            <table>
                <thead><tr>
                    <th scope="col"><button class="sorter-knapp" type="button" data-kolonne="0">Gruppenavn</button></th>
                    <th scope="col" hidden>Gruppe-Id</th>
                    <th scope="col" hidden><button class="sorter-knapp" type="button" data-kolonne="2">Beskrivelse</button></th>
                    <th scope="col"><button class="sorter-knapp" type="button" data-kolonne="3">Antall medlemmer</button></th>
                </tr></thead>
                <tbody id="grupper-rader"></tbody>
            </table>
            </div>
        </section>
    </div>
    </main>
<script type="module" src="/ansatt.js"></script>
</body>
</html>

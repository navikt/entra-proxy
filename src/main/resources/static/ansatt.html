<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ansatt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f3f4;
            color: #1f1f1f;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 90rem;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border: 1px solid #d1d6db;
            border-radius: 8px;
        }
        .ansatt-visning {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(28rem, 100%), 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }
        .sok-knapp { margin-top: 1rem; }
        .medlemskap-resultat {
            grid-column: 1 / -1;
        }
        .status { min-height: 1.5rem; margin-top: 1rem; }
        .status.error { color: #a40000; }
        table {
            width: 100%;
            background: #f3f3f4;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 0.75rem;
            border-bottom: 1px solid #d1d6db;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Ansatt</h1>
    <div class="ansatt-visning">
        <form id="ansatt-form">
            <div class="aksel-form-field">
                <label class="aksel-label" for="ansattid">Ansattid</label>
                <input class="aksel-text-field__input" id="ansattid" name="ansattid" type="text" required placeholder="Ansattid" maxlength="7" pattern="[A-Za-z][0-9]{6}">
            </div>
            <button class="aksel-button sok-knapp" data-variant="primary" data-color="brand-blue" id="sok-ansatt" type="submit">S&#248;k</button>
            <p class="aksel-body-short status" id="status" role="status" aria-live="polite"></p>
        </form>
        <section id="ansatt-resultat" aria-label="Ansattinformasjon" hidden>
            <table>
                <thead><tr><th scope="col">Felt</th><th scope="col">Verdi</th></tr></thead>
                <tbody id="ansatt-felter"></tbody>
            </table>
        </section>
        <section class="medlemskap-resultat" id="enheter-resultat" aria-labelledby="enheter-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="enheter-overskrift">Tilgjengelige enheter</h2>
            <p id="enheter-status"></p>
            <table>
                <thead><tr><th scope="col">Enhetsnummer</th><th scope="col">Enhetsnavn</th></tr></thead>
                <tbody id="enheter-rader"></tbody>
            </table>
        </section>
        <section class="medlemskap-resultat" id="grupper-resultat" aria-labelledby="grupper-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="grupper-overskrift">Gruppemedlemskap</h2>
            <p id="grupper-status"></p>
            <table>
                <thead><tr><th scope="col">Gruppenavn</th><th scope="col">Antall medlemmer</th></tr></thead>
                <tbody id="grupper-rader"></tbody>
            </table>
        </section>
    </div>
</main>
<script>
    const form = document.getElementById('ansatt-form');
    const input = document.getElementById('ansattid');
    const knapp = document.getElementById('sok-ansatt');
    const status = document.getElementById('status');
    const resultat = document.getElementById('ansatt-resultat');
    const felter = document.getElementById('ansatt-felter');
    const enheterResultat = document.getElementById('enheter-resultat');
    const grupperResultat = document.getElementById('grupper-resultat');
    const enheterRader = document.getElementById('enheter-rader');
    const grupperRader = document.getElementById('grupper-rader');
    const enheterStatus = document.getElementById('enheter-status');
    const grupperStatus = document.getElementById('grupper-status');

    async function hentResponse(url, beskrivelse) {
        const response = await fetch(url, {
            headers: {'Accept': 'application/json'}
        });
        if (!response.ok) {
            let melding = `Kunne ikke hente ${beskrivelse} (HTTP ${response.status}).`;
            if (response.headers.get('content-type')?.includes('json')) {
                const problem = await response.json();
                melding = problem.detail ?? melding;
            }
            throw new Error(melding);
        }
        return response;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const ansattid = input.value.trim().toUpperCase();
        resultat.hidden = true;
        enheterResultat.hidden = true;
        grupperResultat.hidden = true;
        felter.replaceChildren();
        enheterRader.replaceChildren();
        grupperRader.replaceChildren();
        status.classList.remove('error');
        knapp.disabled = true;
        status.textContent = 'Henter ansatt...';

        try {
            const response = await hentResponse(`/api/v1/ansatt/${encodeURIComponent(ansattid)}`, 'ansatt');
            if (response.status === 204) {
                status.textContent = 'Ingen ansatt funnet.';
                return;
            }
            const ansatt = await response.json();
            if (ansatt === null) {
                status.textContent = 'Ingen ansatt funnet.';
                return;
            }
            const enheterResponse = await hentResponse(`/api/v1/enhet/ansatt/${encodeURIComponent(ansattid)}`, 'enheter');
            const enheter = await enheterResponse.json();
            const grupperResponse = await hentResponse(`/api/v1/ansatt/tilganger/${encodeURIComponent(ansattid)}`, 'gruppemedlemskap');
            const grupper = await grupperResponse.json();
            const antallMedlemmer = new Map();
            for (const gruppe of grupper) {
                const medlemmerResponse = await hentResponse(
                    `/api/v1/gruppe/medlemmer?${new URLSearchParams({gruppeNavn: gruppe.rolle})}`,
                    `medlemmer i gruppe ${gruppe.rolle}`
                );
                const medlemmer = await medlemmerResponse.json();
                antallMedlemmer.set(gruppe.rolle, medlemmer.length);
            }
            const verdier = [
                ['Nav-ident', ansatt.navIdent],
                ['Navn', ansatt.visningNavn],
                ['Fornavn', ansatt.fornavn],
                ['Etternavn', ansatt.etternavn],
                ['T-ident', ansatt.tIdent],
                ['E-post', ansatt.epost],
                ['Enhetsnummer', ansatt.enhet?.enhetnummer],
                ['Enhetsnavn', ansatt.enhet?.navn]
            ];
            for (const [felt, verdi] of verdier) {
                const rad = document.createElement('tr');
                const feltCelle = document.createElement('th');
                feltCelle.scope = 'row';
                feltCelle.textContent = felt;
                const verdiCelle = document.createElement('td');
                verdiCelle.textContent = verdi ?? '';
                rad.append(feltCelle, verdiCelle);
                felter.appendChild(rad);
            }
            for (const enhet of enheter) {
                const rad = document.createElement('tr');
                const nummerCelle = document.createElement('td');
                nummerCelle.textContent = enhet.enhetnummer;
                const navnCelle = document.createElement('td');
                navnCelle.textContent = enhet.navn;
                rad.append(nummerCelle, navnCelle);
                enheterRader.appendChild(rad);
            }
            for (const gruppe of grupper) {
                const rad = document.createElement('tr');
                const celle = document.createElement('td');
                celle.textContent = gruppe.rolle;
                const antallCelle = document.createElement('td');
                antallCelle.textContent = antallMedlemmer.get(gruppe.rolle) ?? '';
                rad.append(celle, antallCelle);
                grupperRader.appendChild(rad);
            }
            enheterStatus.textContent = enheter.length ? `${enheter.length} enheter` : 'Ingen tilgjengelige enheter';
            grupperStatus.textContent = grupper.length ? `${grupper.length} grupper` : 'Ingen gruppemedlemskap';
            resultat.hidden = false;
            enheterResultat.hidden = false;
            grupperResultat.hidden = false;
            status.textContent = 'Ansatt hentet.';
        } catch (error) {
            status.textContent = `Henting feilet: ${error.message}`;
            status.classList.add('error');
        } finally {
            knapp.disabled = false;
        }
    });
</script>
</body>
</html>

<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ansatt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding-top: 3.5rem;
            background-color: #283b38;
            background-image: url("/wildlife.svg");
            background-position: center;
            background-size: 720px 600px;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 90rem;
            margin: 2rem auto;
            padding: 2rem;
        }
        nav[aria-label="Utforskersider"] {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 1rem;
            background: rgba(18, 43, 40, 0.9);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        nav[aria-label="Utforskersider"] .aksel-button {
            background: transparent;
            box-shadow: none;
            border-radius: 4px;
        }
        nav[aria-label="Utforskersider"] .aksel-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        nav[aria-label="Utforskersider"] .logg-ut {
            margin-left: auto;
        }
        h1 {
            text-shadow: 0 2px 4px #123c2a, 0 0 12px #123c2a;
        }
        .ansatt-visning {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(28rem, 100%), 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }
        .sok-knapp { margin-top: 1rem; }
        #ansattid { width: auto; max-width: 12rem; }
        .filter-rad { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .filter-rad .aksel-label { margin-bottom: 0; }
        #gruppe-filter { width: auto; max-width: 16rem; }
        .aksel-text-field__input,
        .aksel-text-field__input:autofill,
        .aksel-text-field__input:-webkit-autofill {
            background-color: #d3dfd7;
        }
        .aksel-text-field__input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #d3dfd7 inset;
        }
        .medlemskap-resultat {
            grid-column: 1 / -1;
        }
        .grupper-tabell {
            overflow-x: auto;
        }
        .grupper-tabell.med-rullefelt {
            max-height: 70vh;
            overflow-y: auto;
        }
        .grupper-tabell.med-rullefelt thead {
            position: sticky;
            top: 0;
            background: #c5d4cb;
        }
        .status { min-height: 1.5rem; margin-top: 1rem; }
        .status.error { color: #a40000; }
        html.soker,
        html.soker * {
            cursor: url("/kikkert.svg") 16 16, wait !important;
        }
        table {
            width: 100%;
            background: #d3dfd7;
            border-collapse: collapse;
            text-align: left;
            color: #1f1f1f;
        }
        tbody tr:nth-child(even) { background: #c5d4cb; }
        thead th { background: #c5d4cb; }
        th, td {
            padding: 0.75rem;
            border-bottom: 1px solid #d1d6db;
            overflow-wrap: anywhere;
        }
        .enhetsnummer-lenke { color: #00557d; }
        .navident-lenke { color: #00557d; }
        .sorter-knapp {
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }
        .sorter-knapp::after { content: " \2195"; }
        th[aria-sort="ascending"] .sorter-knapp::after { content: " \2191"; }
        th[aria-sort="descending"] .sorter-knapp::after { content: " \2193"; }
    </style>
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Ansatt</h1>
    <nav aria-label="Utforskersider">
        <a class="aksel-button" data-variant="primary" href="/grupper.html">Grupper</a>
        <a class="aksel-button" data-variant="primary" href="/gruppematrise.html">Gruppematrise</a>
        <a class="aksel-button logg-ut" data-variant="primary" data-color="danger" href="/oauth2/logout">Logg ut</a>
    </nav>
    <div class="ansatt-visning">
        <form id="ansatt-form">
            <div class="aksel-form-field">
                <label class="aksel-label" for="ansattid">Ansattid</label>
                <input class="aksel-text-field__input" id="ansattid" name="ansattid" type="text" required placeholder="Ansattid" maxlength="7" pattern="[A-Za-z][0-9]{6}">
            </div>
            <button class="aksel-button sok-knapp" data-variant="primary" data-color="brand-blue" id="sok-ansatt" type="submit">S&#248;k</button>
            <p class="aksel-body-short status" id="status" role="status" aria-live="polite"></p>
        </form>
        <section id="ansatt-resultat" aria-labelledby="ansatt-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="ansatt-overskrift">Personinformasjon (Nom)</h2>
            <table>
                <tbody id="ansatt-felter"></tbody>
            </table>
        </section>
        <section class="medlemskap-resultat" id="enheter-resultat" aria-labelledby="enheter-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="enheter-overskrift">Tilgjengelig enheter (Nom)</h2>
            <table>
                <thead><tr><th scope="col">Enhetsnummer</th><th scope="col">Enhetsnavn</th><th scope="col">Nom-Id</th><th scope="col" id="enheter-ledere-kolonne" hidden>Ledere</th></tr></thead>
                <tbody id="enheter-rader"></tbody>
            </table>
        </section>
        <section class="medlemskap-resultat" id="grupper-resultat" aria-labelledby="grupper-overskrift" hidden>
            <h2 class="aksel-heading aksel-heading--medium" id="grupper-overskrift">Gruppemedlemskap</h2>
            <p id="grupper-status"></p>
            <div class="filter-rad">
                <label class="aksel-label" for="gruppe-filter">Filtrer gruppenavn</label>
                <input class="aksel-text-field__input" id="gruppe-filter" name="filter" type="text" autocomplete="off" placeholder="Inneholder...">
            </div>
            <div class="grupper-tabell" tabindex="0" role="region" aria-labelledby="grupper-overskrift">
            <table>
                <thead><tr>
                    <th scope="col"><button class="sorter-knapp" type="button" data-kolonne="0">Gruppenavn</button></th>
                    <th scope="col" hidden>Gruppe-Id</th>
                    <th scope="col" hidden><button class="sorter-knapp" type="button" data-kolonne="2">Beskrivelse</button></th>
                    <th scope="col"><button class="sorter-knapp" type="button" data-kolonne="3">Antall medlemmer</button></th>
                </tr></thead>
                <tbody id="grupper-rader"></tbody>
            </table>
            </div>
        </section>
    </div>
    </main>
<script type="module" src="/ansatt.js"></script>
</body>
</html>

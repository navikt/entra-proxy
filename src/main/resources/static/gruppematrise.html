<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sammenlign grupper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            min-height: 100vh;
            padding-top: 3.5rem;
            background-color: #283b38;
            background-image: url("/wildlife.svg");
            background-position: center;
            background-size: 720px 600px;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 90rem;
            margin: 2rem auto;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            text-shadow: 0 2px 4px #123c2a, 0 0 12px #123c2a;
        }
        form {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 32rem;
            margin: 0 auto 2rem;
            gap: 1.5rem;
        }
        .aksel-text-field__input {
            background-color: #d3dfd7;
        }
        .sok-knapper {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .status { min-height: 1.5rem; margin-top: 1rem; }
        .status.error { color: #ffb4b4; }
        .sok-panel > h2 { text-align: center; }
        .hovedsok {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 32rem;
            margin: 0 auto;
            gap: 1.5rem;
        }
        .hovedsok > p { text-align: center; margin: 0; font-weight: bold; }
        @media (min-width: 60rem) {
            .hovedsok {
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                max-width: none;
            }
            .hovedsok > p { align-self: start; margin-top: 3rem; }
        }
        .steg-skille { margin: 2.5rem 0 2rem; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.3); }
        .kopi-rad { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .kopi-rad .status { margin-top: 0; min-height: 0; }
        html.soker,
        html.soker * {
            cursor: url("/kikkert.svg") 16 16, wait !important;
        }
        .tabell-ramme {
            background: #d3dfd7;
            overflow: auto;
            color: #1f1f1f;
            max-height: 75vh;
        }
        table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid #d1d6db;
            overflow-wrap: anywhere;
            white-space: nowrap;
        }
        thead th {
            position: sticky;
            top: 0;
            background: #c5d4cb;
            vertical-align: bottom;
        }
        tbody th[scope="row"] {
            position: sticky;
            left: 0;
            background: #d3dfd7;
            font-weight: bold;
        }
        tbody tr:nth-child(even) th[scope="row"],
        tbody tr:nth-child(even) td { background: #c5d4cb; }
        td.ja { color: #0a6e2e; font-weight: bold; text-align: center; font-size: 1.1rem; }
        td.nei { color: #6b6b6b; text-align: center; }
        .navident-lenke { color: #00557d; }
        .sorter-knapp {
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            white-space: nowrap;
        }
        .sorter-knapp::after { content: " \2195"; opacity: 0.5; }
        th[aria-sort="ascending"] .sorter-knapp::after { content: " \2191"; opacity: 1; }
        th[aria-sort="descending"] .sorter-knapp::after { content: " \2193"; opacity: 1; }
        nav[aria-label="Utforskersider"] {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 1rem;
            background: rgba(18, 43, 40, 0.9);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        nav[aria-label="Utforskersider"] .aksel-button {
            background: transparent;
            box-shadow: none;
            border-radius: 4px;
        }
        nav[aria-label="Utforskersider"] .aksel-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        nav[aria-label="Utforskersider"] .logg-ut {
            margin-left: auto;
        }
    </style>
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Sammenlign grupper</h1>
    <nav aria-label="Utforskersider">
        <a class="aksel-button" data-variant="primary" href="/ansatt.html">Ansatt</a>
        <a class="aksel-button" data-variant="primary" href="/grupper.html">Grupper</a>
        <a class="aksel-button logg-ut" data-variant="primary" data-color="danger" href="/oauth2/logout">Logg ut</a>
    </nav>

    <section class="sok-panel" aria-label="Velg gruppe som skal utforskes">
        <h2 class="aksel-heading aksel-heading--medium">Velg gruppe som skal utforskes</h2>
        <div class="hovedsok">
            <form id="nom-form" class="nom-form">
                <div class="aksel-form-field">
                    <label class="aksel-label" for="tilgangsenhetId">Nom tilgangsenhet / enhet</label>
                    <input class="aksel-text-field__input" id="tilgangsenhetId" name="tilgangsenhetId" type="text"
                           pattern="[0-9]{4}|[a-z]{2}[0-9]{3}[a-z]" minlength="4" maxlength="6" required
                           autocomplete="off" placeholder="4 siffer (tilgangsenhet) eller 6 tegn (enhet)">
                </div>
                <div class="sok-knapper">
                    <button class="aksel-button" data-variant="primary" data-color="brand-blue" type="submit">Hent medlemmer</button>
                </div>
                <p class="aksel-body-short status" id="nom-status" role="status" aria-live="polite"></p>
            </form>
            <p class="aksel-body-short" aria-hidden="true">eller</p>
            <form id="gruppe-form">
                <div class="aksel-form-field">
                    <label class="aksel-label" for="basisGruppeNavn">Entra gruppenavn</label>
                    <input class="aksel-text-field__input" id="basisGruppeNavn" name="basisGruppeNavn" type="text" required
                           autocomplete="off" placeholder="Gruppenavn">
                </div>
                <div class="sok-knapper">
                    <button class="aksel-button" data-variant="primary" data-color="brand-blue" type="submit">Hent medlemmer</button>
                </div>
                <p class="aksel-body-short status" id="basis-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </section>

    <section id="basis-resultat" aria-labelledby="basis-overskrift" hidden>
        <h2 class="aksel-visually-hidden" id="basis-overskrift">Ansatte som skal utforskes</h2>
        <table aria-label="Ansatte som skal utforskes">
            <thead>
                <tr><th scope="col">Nav-ident</th><th scope="col">Navn</th></tr>
            </thead>
            <tbody id="basis-rader"></tbody>
        </table>
    </section>

    <hr class="steg-skille">

    <section class="sok-panel" aria-label="Matrisesøk">
        <h2 class="aksel-heading aksel-heading--medium">Bygg matrise fra gruppenavn</h2>
        <form id="sok-form">
            <div class="aksel-form-field">
                <label class="aksel-label" for="gruppeNavn">Del av gruppenavn</label>
                <input class="aksel-text-field__input" id="gruppeNavn" name="gruppeNavn" type="text" required
                       autocomplete="off" placeholder="F.eks. TEMA">
            </div>
            <div class="sok-knapper">
                <button class="aksel-button" data-variant="primary" data-color="brand-blue" type="submit">Bygg matrise</button>
            </div>
            <p class="aksel-body-short status" id="status" role="status" aria-live="polite"></p>
        </form>
    </section>

    <section id="resultat" aria-labelledby="resultat-overskrift" hidden>
        <h2 class="aksel-heading aksel-heading--medium aksel-visually-hidden" id="resultat-overskrift">Medlemskap per ansatt</h2>
        <div class="kopi-rad">
            <button class="aksel-button" data-variant="primary" data-color="brand-blue" id="kopier-matrise" type="button">Kopier til utklippstavlen</button>
            <p class="aksel-body-short status" id="kopier-status" role="status" aria-live="polite"></p>
        </div>
        <div class="tabell-ramme" tabindex="0" role="region" aria-labelledby="resultat-overskrift">
            <table aria-label="Medlemskap per ansatt og gruppe">
                <thead id="tabell-overskrift"></thead>
                <tbody id="tabell-rader"></tbody>
            </table>
        </div>
    </section>
</main>
<script type="module" src="/gruppematrise.js"></script>
</body>
</html>

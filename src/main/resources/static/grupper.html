<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Medlemmer i grupper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body {
            margin: 0;
            min-height: 100vh;
            padding-top: 3.5rem;
            background-color: #283b38;
            background-image: url("/wildlife.svg");
            background-position: center;
            background-size: 720px 600px;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 90rem;
            margin: 2rem auto;
            padding: 2rem;
        }
        nav[aria-label="Utforskersider"] {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem 1rem;
            background: rgba(18, 43, 40, 0.9);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }
        nav[aria-label="Utforskersider"] .aksel-button {
            background: transparent;
            box-shadow: none;
            border-radius: 4px;
        }
        nav[aria-label="Utforskersider"] .aksel-button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        nav[aria-label="Utforskersider"] .logg-ut {
            margin-left: auto;
        }
        h1 {
            text-align: center;
            text-shadow: 0 2px 4px #123c2a, 0 0 12px #123c2a;
        }
        #sok {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(28rem, 100%), 1fr));
            gap: 2rem;
            padding-bottom: 1rem;
        }
        .sok-panel:first-child {
            grid-column: 1 / -1;
        }
        .sok-panel:first-child > h2 {
            text-align: center;
        }
        #sammenligningsoverskrift {
            grid-column: 1 / -1;
        }
        .sok-panel {
            min-width: 0;
        }
        .hovedsok {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 32rem;
            gap: 1.5rem;
        }
        .hovedsok > p {
            text-align: left;
            margin: 0;
        }
        @media (min-width: 60rem) {
            .sok-panel:first-child .hovedsok {
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                max-width: none;
            }
            .hovedsok > p {
                align-self: start;
                margin-top: 3rem;
            }
        }
        .aksel-text-field__input,
        .aksel-text-field__input:autofill,
        .aksel-text-field__input:-webkit-autofill {
            background-color: #d3dfd7;
        }
        .aksel-text-field__input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #d3dfd7 inset;
        }
        .inaktivt-sok {
            filter: grayscale(1);
            opacity: 0.65;
        }
        html.soker,
        html.soker * {
            cursor: url("/kikkert.svg") 16 16, wait !important;
        }
        .sok-knapper {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }
        .sammenligningsknapp {
            justify-content: center;
            align-items: center;
        }
        .medlemmer-bryter {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }
        .medlemmer-bryter input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .medlemmer-bryter__spor {
            position: relative;
            flex: none;
            width: 2.75rem;
            height: 1.5rem;
            border-radius: 1rem;
            background: #6b7a74;
            transition: background 0.15s ease;
        }
        .medlemmer-bryter__spor::after {
            content: "";
            position: absolute;
            top: 0.15rem;
            left: 0.15rem;
            width: 1.2rem;
            height: 1.2rem;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.15s ease;
        }
        .medlemmer-bryter input:checked + .medlemmer-bryter__spor {
            background: #06893a;
        }
        .medlemmer-bryter input:checked + .medlemmer-bryter__spor::after {
            transform: translateX(1.25rem);
        }
        .medlemmer-bryter input:focus-visible + .medlemmer-bryter__spor {
            outline: 3px solid #99c4ff;
            outline-offset: 2px;
        }
        .status { min-height: 1.5rem; margin-top: 1rem; }
        .status.error { color: #a40000; }
        .oppsummering {
            width: 100%;
            background: #d3dfd7;
            border-collapse: collapse;
            text-align: left;
            color: #1f1f1f;
        }
        .oppsummering th,
        .oppsummering td {
            padding: 0.75rem;
            border-bottom: 1px solid #d1d6db;
        }
        tbody tr:nth-child(even) { background: #c5d4cb; }
        thead th { background: #c5d4cb; }
        .sammenligning-tabell {
            background: #d3dfd7;
            overflow-x: auto;
            color: #1f1f1f;
        }
        .sammenligning-tabell.med-rullefelt {
            max-height: 70vh;
            overflow-y: auto;
        }
        .sammenligning-tabell.med-rullefelt thead {
            position: sticky;
            top: 0;
            background: #c5d4cb;
        }
        #sammenligning-detaljer {
            margin-top: 3rem;
            padding-top: 1.5rem;
        }
        .sammenligning-tabell table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .sammenligning-tabell th,
        .sammenligning-tabell td {
            padding: 0.75rem;
            border-bottom: 1px solid #d1d6db;
        }
        .navident-lenke { color: #00557d; }
        .sorter-knapp {
            padding: 0;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            font-weight: inherit;
            text-align: left;
            cursor: pointer;
        }
        .sorter-knapp::after {
            content: " \2195";
        }
        th[aria-sort="ascending"] .sorter-knapp::after {
            content: " \2191";
        }
        th[aria-sort="descending"] .sorter-knapp::after {
            content: " \2193";
        }
        .oppsummering td:last-child,
        .oppsummering th:last-child {
            text-align: right;
        }
        th, td { overflow-wrap: anywhere; }
    </style>
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Medlemmer i grupper</h1>
    <nav aria-label="Utforskersider">
        <a class="aksel-button" data-variant="primary" href="/ansatt.html">Ansatt</a>
        <a class="aksel-button" data-variant="primary" href="/gruppematrise.html">Gruppematrise</a>
        <a class="aksel-button logg-ut" data-variant="primary" data-color="danger" href="/oauth2/logout">Logg ut</a>
    </nav>
    <div id="sok">
    <section class="sok-panel" aria-label="Gruppesøk 1">
    <h2 class="aksel-heading aksel-heading--medium">Velg gruppe som skal utforskes</h2>
    <div class="hovedsok">
    <form id="nom-form" class="nom-form">
        <div class="aksel-form-field" style="margin-top: 1rem;">
            <label class="aksel-label" for="tilgangsenhetId">Nom tilgangsenhet / enhet</label>
            <input class="aksel-text-field__input" id="tilgangsenhetId" name="tilgangsenhetId" type="text" pattern="[0-9]{4}|[a-z]{2}[0-9]{3}[a-z]" minlength="4" maxlength="6" required placeholder="4 siffer (tilgangsenhet) eller 6 tegn (enhet)">
        </div>
        <div class="sok-knapper">
            <button class="aksel-button" data-variant="primary" data-color="brand-blue" type="submit">Hent medlemmer</button>
        </div>
        <p class="aksel-body-short status" id="nom-status" role="status" aria-live="polite"></p>
    </form>
    <p class="aksel-body-short" aria-hidden="true" style="font-weight: bold; font-size: 1.25rem;">eller</p>
    <form id="gruppe-form">
        <div class="aksel-form-field" style="margin-top: 1rem;">
            <label class="aksel-label" for="gruppeNavn">Entra gruppenavn</label>
            <input class="aksel-text-field__input" id="gruppeNavn" name="gruppeNavn" type="text" required placeholder="Gruppenavn">
        </div>
        <div class="sok-knapper">
            <button class="aksel-button" data-variant="primary" data-color="brand-blue" id="vis-medlemmer" type="submit">Hent medlemmer</button>
            <button class="aksel-button fjern-gruppe" data-variant="primary" data-color="danger" type="button" hidden>Fjern gruppe</button>
        </div>
        <p class="aksel-body-short status" id="status" role="status" aria-live="polite"></p>
    </form>
    </div>
    <div class="sok-knapper sammenligningsknapp">
        <button class="aksel-button nytt-sok" data-variant="primary" data-color="brand-blue" type="button" disabled>Ny sammenligningsgruppe</button>
        <label class="medlemmer-bryter" hidden>
            <input type="checkbox" id="vis-utforsket-medlemmer">
            <span class="medlemmer-bryter__spor" aria-hidden="true"></span>
            <span>Vis medlemmer i gruppa som utforskes</span>
        </label>
    </div>
    </section>
    <h2 class="aksel-heading aksel-heading--medium" id="sammenligningsoverskrift" hidden>Sammenligningsgrupper</h2>
    </div>
    <section id="utforsket-medlemmer-resultat" aria-labelledby="utforsket-medlemmer-overskrift" hidden>
        <h2 class="aksel-heading aksel-heading--medium" id="utforsket-medlemmer-overskrift">Medlemmer i gruppa som utforskes</h2>
        <p class="aksel-body-short status" id="utforsket-medlemmer-status" role="status" aria-live="polite"></p>
        <div class="sammenligning-tabell" tabindex="0" role="region" aria-labelledby="utforsket-medlemmer-overskrift">
            <table aria-label="Medlemmer i gruppa som utforskes">
                <thead>
                <tr id="utforsket-medlemmer-overskrift-rad"></tr>
                </thead>
                <tbody id="utforsket-medlemmer-rader"></tbody>
            </table>
        </div>
    </section>
    <section id="felles-resultat" aria-labelledby="felles-overskrift" hidden>
        <h2 class="aksel-heading aksel-heading--medium" id="felles-overskrift">Oppsummering</h2>
        <p class="aksel-body-short status" id="felles-status" role="status" aria-live="polite"></p>
        <table class="oppsummering">
            <thead>
            <tr><th scope="col">Grupper</th><th scope="col">Antall medlemmer</th></tr>
            </thead>
            <tbody id="felles-medlemmer"></tbody>
        </table>
    </section>
    <section id="sammenligning-detaljer" aria-labelledby="sammenligning-detaljer-overskrift" hidden>
        <h2 class="aksel-heading aksel-heading--medium" id="sammenligning-detaljer-overskrift">Detaljvisning</h2>
        <button class="aksel-button" data-variant="primary" data-color="brand-blue" id="kopier-detaljvisning" type="button">Kopier til utklippstavlen</button>
        <p class="aksel-body-short status" id="kopier-status" role="status" aria-live="polite"></p>
        <div class="sammenligning-tabell" tabindex="0" role="region" aria-labelledby="sammenligning-detaljer-overskrift">
            <table aria-label="Medlemskap i sammenligningsgrupper">
                <thead id="sammenligning-tabell-overskrift"></thead>
                <tbody id="sammenligning-tabell-rader"></tbody>
            </table>
        </div>
    </section>
</main>
<script type="module" src="/grupper.js"></script>
</body>
</html>

<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utforsker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <script src="/cache.js" defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #283b38;
            background-image: url("/wildlife.svg");
            background-position: center;
            background-size: 720px 600px;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 90rem;
            margin: 2rem auto;
            padding: 2rem;
        }
        h1 {
            text-shadow: 0 2px 4px #123c2a, 0 0 12px #123c2a;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
        .status.error { color: #ffb4b4; }
        img.professor {
            display: block;
            width: 80%;
            max-width: 32rem;
            height: auto;
            margin: 1.5rem 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Utforsker</h1>
    <nav aria-label="Utforskersider">
        <button type="button" class="aksel-button" data-variant="primary" onclick="location.href='/ansatt.html'">Ansatt</button>
        <button type="button" class="aksel-button" data-variant="primary" onclick="location.href='/grupper.html'">Grupper</button>
        <button type="button" class="aksel-button" data-variant="primary" onclick="location.href='/gruppematrise.html'">Sammenlign grupper</button>
        <button type="button" class="aksel-button" data-variant="primary" id="oppfrisk-caches">Oppfrisk cache</button>
    </nav>
    <p class="aksel-body-short status" id="cache-status" role="status" aria-live="polite" hidden></p>
    <img class="professor" src="explorer.png" alt="Professor Drøvel">
</main>
</body>
</html>

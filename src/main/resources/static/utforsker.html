<!doctype html>
<html lang="nb">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Utforsker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@navikt/ds-css@8.16.2/dist/index.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #f3f3f4;
            color: #1f1f1f;
            font-family: Arial, sans-serif;
        }
        main {
            max-width: 90rem;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border: 1px solid #d1d6db;
            border-radius: 8px;
        }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
<main>
    <h1 class="aksel-heading aksel-heading--large">Utforsker</h1>
    <nav aria-label="Utforskersider">
        <a class="aksel-link" id="ansatt-lenke" href="/ansatt.html">Ansatt</a>
        <a class="aksel-link" href="/grupper.html">Grupper</a>
    </nav>
</main>
<script>
    // ansatt.html er kun tilgjengelig i milj\u00f8er som ikke er prod (f.eks. ikke i prod-gcp).
    // Vi skjuler lenken der siden bekreftet ikke finnes (HTTP 404), men "feiler \u00e5pent"
    // (behold lenken) ved usikre feil som nettverksfeil eller blokkerte foresp\u00f8rsler,
    // slik at vi ikke risikerer \u00e5 skjule en fungerende lenke ved f.eks. proxy-/CSP-kvirker.
    fetch('/ansatt.html', {method: 'GET', cache: 'no-store'})
        .then(response => {
            if (response.status === 404) {
                document.getElementById('ansatt-lenke').remove();
            }
        })
        .catch(() => {
            // Usikker feil (nettverk, CSP, proxy o.l.) \u2013 behold lenken synlig.
        });
</script>
</body>
</html>

spring:
  autoconfigure:
    exclude:
      - io.valkey.springframework.boot.actuate.autoconfigure.metrics.valkey.LettuceObservationAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
  data:
    valkey:
      client-type: valkeyglide
      timeout: 2s
      connect-timeout: 2s
      valkey-glide:
        connection-timeout: ${spring.data.valkey.connect-timeout}
    redis:
      client-type: lettuce
      timeout: 2s
      connect-timeout: 2s
  security:
    oauth2:
      client:
        provider:
          azuread:
            authorization-uri: http://mock-oauth2-server/authorize
            token-uri: http://mock-oauth2-server/token
            jwk-set-uri: http://mock-oauth2-server/jwks
            user-info-uri: http://mock-oauth2-server/userinfo
            user-name-attribute: sub
        registration:
          norg:
            provider: azuread
            client-id: test
            client-secret: test
            authorization-grant-type: client_credentials
            scope:
              - norg-scope
          entra:
            provider: azuread
            client-id: test
            client-secret: test
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
